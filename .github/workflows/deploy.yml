name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# PR runs share a per-PR group with preview-cleanup.yml, so closing a PR
# cancels an in-flight preview deploy and the cleanup runs after it ends —
# a deploy can never recreate the Worker after cleanup deleted it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  # Per-PR preview Workers are named "<PREVIEW_PREFIX>-<PR number>".
  # Keep in sync with preview-cleanup.yml and the "name" in wrangler.jsonc.
  PREVIEW_PREFIX: cf-starter-preview-pr

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 15
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ github.token }}
          environment: Preview (${{ github.head_ref }})
          initial-status: pending

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Get Playwright version
        id: playwright-version
        # Only feeds the e2e container image tag; skip on main pushes and fork PRs.
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Run build
        run: mise run build
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}

      # Using D1? Apply migrations here, before the deploy step.
      # See docs/recipes/d1-drizzle.md.

      - name: Deploy to Cloudflare
        id: deploy
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            ${{ github.ref == 'refs/heads/main'
              && 'deploy'
              || format('deploy --env preview --name {0}-{1}', env.PREVIEW_PREFIX, github.event.pull_request.number)
            }}

      - name: Update Deployment
        uses: chrnorm/deployment-status@v2
        # Non-blocking: a status-report failure must not fail the deploy job, which
        # would suppress the e2e job (needs.deploy.result == 'success'). Failure is
        # still visible as a warning step in the run log.
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.deployment.outcome == 'success'
        with:
          token: ${{ github.token }}
          environment-url: ${{ steps.deploy.outputs.deployment-url }}
          state: ${{ steps.deploy.outcome == 'success' && 'success' || 'error' }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

  e2e:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && needs.deploy.result == 'success'
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.deploy.outputs.playwright-version }}-noble
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run E2E Tests
        run: mise run test:e2e:ci
        env:
          # Playwright container jobs run as root, but GitHub sets HOME=/github/home (owned by
          # pwuser). Firefox refuses to launch as root when $HOME isn't root-owned.
          # See: playwright.dev "Set the HOME=/root environment variable in your GitHub Actions workflow".
          HOME: /root
          BASE_URL: ${{ needs.deploy.outputs.deployment-url }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.event.number }}
          path: e2e/playwright-report/
